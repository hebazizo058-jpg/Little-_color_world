<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mariam World</title><style>body{font-family:sans-serif;background:#FFF7ED;text-align:center;margin:0}.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:30px;color:#fff;font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:400px;margin:-20px auto} .c{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 0 #FFE0B2} .c img{width:100%;height:110px;object-fit:contain} canvas{background:#fff;border-radius:12px;max-width:95vw} #p{position:fixed;inset:0;background:#FFF7ED;display:none;overflow:auto;padding:10px}</style></head><body><div class="hero">🎨 Mariam's little color world</div><div class="grid"><div class="c" onclick="openI(0)"><img id="i0"><br>🧜‍♀️ Mermaid</div><div class="c" onclick="openI(1)"><img id="i1"><br>🦕 Dino</div><div class="c" onclick="openI(2)"><img id="i2"><br>🕷️ Spider</div><div class="c" onclick="openI(3)"><img id="i3"><br>🧸 Teddy</div><div class="c" onclick="openI(4)"><img id="i4"><br>🐟 Dory</div></div><div id="p"><button onclick="document.getElementById('p').style.display='none'" style="padding:8px 14px">⬅ رجوع</button><br><canvas id="cv"></canvas><br><div id="cols"></div><br><button onclick="clr()">مسح</button> <button onclick="save()">حفظ 💾</button></div>
<script>
const svgs=[
`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='black' stroke-width='4'><circle cx='100' cy='80' r='40'/><circle cx='85' cy='75' r='5' fill='black'/><circle cx='115' cy='75' r='5' fill='black'/><path d='M90 95 Q100 105 110 95'/><path d='M40 140 Q100 180 160 140 Q140 200 100 200 Q60 200 40 140'/><path d='M60 50 Q40 30 50 10 Q70 20 80 40'/></g></svg>`,
`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='black' stroke-width='4'><ellipse cx='100' cy='120' rx='70' ry='50'/><circle cx='100' cy='70' r='35'/><circle cx='90' cy='65' r='4' fill='black'/><circle cx='110' cy='65' r='4' fill='black'/><path d='M100 20 L110 40 L90 40 Z'/><path d='M30 120 Q20 130 30 140'/><path d='M170 120 Q180 130 170 140'/></g></svg>`,
`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='black' stroke-width='4'><circle cx='100' cy='80' r='35'/><rect x='75' y='115' width='50' height='50' rx='10'/><circle cx='80' cy='60' r='6'/><circle cx='120' cy='60' r='6'/><path d='M70 130 L30 150 M130 130 L170 150'/></g></svg>`,
`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='black' stroke-width='4'><circle cx='100' cy='80' r='40'/><circle cx='70' cy='60' r='15'/><circle cx='130' cy='60' r='15'/><ellipse cx='100' cy='140' rx='50' ry='35'/><path d='M70 130 Q100 110 130 130'/></g></svg>`,
`data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='black' stroke-width='4'><ellipse cx='100' cy='100' rx='70' ry='40'/><path d='M30 100 L10 80 L10 120 Z'/><circle cx='130' cy='90' r='8' fill='black'/><path d='M80 80 Q100 70 120 80'/></g></svg>`
];
svgs.forEach((s,i)=>document.getElementById('i'+i).src=s);
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),img=new Image(),cur=0;
const colors=["#000","#FF0000","#00E676","#2962FF","#FFEB3B","#FF6D00","#7C4DFF","#FF00FF","#00E5FF","#fff"];
let curC=colors[1];
let cols=document.getElementById('cols');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.style.width='30px';b.style.height='30px';b.style.borderRadius='50%';b.style.margin='3px';b.onclick=()=>curC=c;cols.appendChild(b);});
function openI(i){cur=i;document.getElementById('p').style.display='block';img=new Image();img.src=svgs[i];img.onload=()=>{cv.width=500;cv.height=500;ctx.fillStyle='#fff';ctx.fillRect(0,0,500,500);ctx.drawImage(img,50,20,400,400);};}
function clr(){ctx.fillStyle='#fff';ctx.fillRect(0,0,500,500);ctx.drawImage(img,50,20,400,400);}
function save(){let a=document.createElement('a');a.download='art.png';a.href=cv.toDataURL();a.click();}
cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);ctx.fillStyle=curC;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();});
</script></body></html>
