<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariam World</title>
<style>
body{margin:0;background:#FFF7ED;font-family:sans-serif;text-align:center}
.hero{background:#FF6B6B;padding:20px;color:#fff;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:400px;margin:0 auto}
.card{background:#fff;border-radius:20px;padding:20px 10px;box-shadow:0 4px 0 #FFD180;font-size:50px;cursor:pointer}
.card b{display:block;font-size:14px;margin-top:8px;color:#5D4037}
#paint{position:fixed;inset:0;background:#FFF7ED;display:none;padding:10px;overflow:auto}
#cv{background:#fff;border-radius:16px;box-shadow:0 4px 15px #0002;display:block;margin:10px auto;touch-action:none}
.dot{width:36px;height:36px;border-radius:50%;display:inline-block;margin:4px;border:3px solid #fff;box-shadow:0 1px 3px #0005;cursor:pointer}
</style>
</head>
<body>
<div class="hero">🎨 Mariam's little color world 🌈</div>
<p style="background:#fff;display:inline-block;padding:6px 12px;border-radius:20px;margin:10px;font-weight:700;color:#FF6F00">دوسي على واحدة عشان تلونيها</p>
<div class="grid">
<div class="card" onclick="openP('🧜‍♀️')">🧜‍♀️<b>Mermaid</b></div>
<div class="card" onclick="openP('🦕')">🦕<b>Dino Party</b></div>
<div class="card" onclick="openP('🕷️')">🕷️<b>Spider Hero</b></div>
<div class="card" onclick="openP('🧸')">🧸<b>Teddy Bear</b></div>
<div class="card" onclick="openP('🐟')">🐟<b>Dory Fish</b></div>
<div class="card" onclick="openP('🦄')">🦄<b>Unicorn</b></div>
</div>

<div id="paint">
<div style="background:#fff;padding:8px;border-radius:12px;display:flex;justify-content:space-between;max-width:500px;margin:0 auto">
<button onclick="document.getElementById('paint').style.display='none'" style="padding:8px 14px;border:none;border-radius:10px;background:#8D6E63;color:#fff;font-weight:800">⬅ رجوع</button>
<b id="t">لوني</b>
<button onclick="clearC()" style="padding:8px 14px;border:none;border-radius:10px;background:#FFAB91;font-weight:800">مسح</button>
</div>
<canvas id="cv" width="500" height="500"></canvas>
<div id="pal" style="background:#fff;padding:10px;border-radius:12px;max-width:400px;margin:10px auto"></div>
<button onclick="saveC()" style="padding:10px 20px;border:none;border-radius:12px;background:#4ECDC4;color:#fff;font-weight:800;font-size:16px">حفظ الرسمة 💾</button>
</div>

<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cur='#FF0000',emoji='🧜‍♀️';
let cols=["#000000","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00BCD4","#FF6D00","#795548","#FFFFFF"];
let pal=document.getElementById('pal');
cols.forEach(c=>{
let d=document.createElement('div');d.className='dot';d.style.background=c;
d.onclick=()=>{cur=c;document.querySelectorAll('.dot').forEach(x=>x.style.outline='');d.style.outline='3px solid #000'};
pal.appendChild(d);
});
pal.firstChild.nextSibling.style.outline='3px solid #000';

function openP(e){
emoji=e;
document.getElementById('t').innerText='بلوني '+e;
document.getElementById('paint').style.display='block';
clearC();
}
function clearC(){
ctx.fillStyle='#fff';ctx.fillRect(0,0,500,500);
ctx.font='180px sans-serif';ctx.textAlign='center';ctx.fillText(emoji,250,280);
ctx.font='18px sans-serif';ctx.fillStyle='#FF8A65';ctx.fillText('لوني حوالين الاموجي يا مريم!',250,350);
}
function saveC(){
let a=document.createElement('a');a.download='mariam-art.png';a.href=cv.toDataURL();a.click();
}
cv.addEventListener('click',e=>{
let r=cv.getBoundingClientRect();
let x=(e.clientX-r.left)*(500/r.width),y=(e.clientY-r.top)*(500/r.height);
ctx.fillStyle=cur;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
});
let drawing=false;
cv.addEventListener('touchstart',e=>{drawing=true;e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{
if(!drawing)return;
let r=cv.getBoundingClientRect();
let x=(e.touches[0].clientX-r.left)*(500/r.width),y=(e.touches[0].clientY-r.top)*(500/r.height);
ctx.fillStyle=cur;ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
},{passive:false});
cv.addEventListener('touchend',()=>drawing=false);
clearC();
</script>
</body>
</html>
