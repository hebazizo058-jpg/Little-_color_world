<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World</title>
<style>
body{margin:0;font-family:Arial;background:#FFF8F0;text-align:center}
header{background:white;padding:15px;font-weight:bold;box-shadow:0 2px 10px #0001}
.hero{padding:60px 20px;background:linear-gradient(135deg,#FFD93D,#FF6B9E,#7C5CFF);color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px;max-width:500px;margin:auto}
.card{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 15px #0002}
.btn{background:#7C5CFF;color:white;padding:10px 20px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<header>🎨 Little Color World</header>
<div class="hero">
<h1>Color Your World! 🖍️</h1>
<p>Fun coloring pages for kids</p>
</div>
<div class="grid">
<div class="card">🐶<h3>Puppy</h3><a class="btn" href="#">Print</a></div>
<div class="card">🦄<h3>Unicorn</h3><a class="btn" href="#">Print</a></div>
<div class="card">🦕<h3>Dino</h3><a class="btn" href="#">Print</a></div>
<div class="card">👑<h3>Princess</h3><a class="btn" href="#">Print</a></div>
</div>
</body>
</html>
