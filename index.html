<style>
body{font-family:Arial;background:#FFF8E1;text-align:center;margin:0;padding:15px}
h1{color:#FF6F00}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.gallery img{width:160px;height:160px;object-fit:contain;background:white;border-radius:15px;border:3px solid #FFCC80;padding:10px;cursor:pointer}
#colorPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF8E1;z-index:999;padding:10px;box-sizing:border-box;overflow:auto}
#mainCanvas{border:3px solid #FFCC80;border-radius:12px;background:white;touch-action:none;max-width:95vw;max-height:60vh;display:block;margin:15px auto;cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(9, 1fr);gap:6px;max-width:380px;margin:10px auto;background:white;padding:10px;border-radius:12px;border:2px solid #FFCC80}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #999;cursor:pointer}
.color.active{border:3px solid #000;transform:scale(1.2);z-index:1}
button{padding:10px 16px;border:none;border-radius:10px;background:#FF6F00;color:white;font-weight:bold;cursor:pointer;margin:4px}
#backBtn{background:#888}

<script>
let canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d'), currentColor='#FF0000', imgObj=new Image();
function openColor(src){document.getElementById('homePage').style.display='none';document.getElementById('colorPage').style.display='block';imgObj.crossOrigin='anonymous';imgObj.src=src;imgObj.onload=()=>{canvas.width=imgObj.naturalWidth;canvas.height=imgObj.naturalHeight;ctx.drawImage(imgObj,0,0);}}
function closeColor(){document.getElementById('colorPage').style.display='none';document.getElementById('homePage').style.display='block';}
function setColor(c,el){currentColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function hexToRgba(hex){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return [r,g,b,255];}
function getPos(e){let rect=canvas.getBoundingClientRect();let clientX=e.touches?e.touches[0].clientX:e.clientX;let clientY=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.floor((clientX-rect.left)*(canvas.width/rect.width)),y:Math.floor((clientY-rect.top)*(canvas.height/rect.height))}}
function floodFill(startX,startY,fillColor){
 let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);let data=imageData.data;let stack=[[startX,startY]];let startPos=(startY*canvas.width+startX)*4;let startR=data[startPos],startG=data[startPos+1],startB=data[startPos+2];let [fillR,fillG,fillB]=fillColor;if(startR===fillR&&startG===fillG&&startB===fillB)return;let visited=new Uint8Array(canvas.width*canvas.height);
 function match(pos){let r=data[pos],g=data[pos+1],b=data[pos+2];let isBlack=r<30&&g<30&&b<30;if(isBlack)return false;return Math.abs(r-startR)<28&&Math.abs(g-startG)<28&&Math.abs(b-startB)<28;}
 while(stack.length){let [x,y]=stack.pop();let idx=y*canvas.width+x;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(visited[idx])continue;visited[idx]=1;let pos=(y*canvas.width+x)*4;if(!match(pos))continue;data[pos]=fillR;data[pos+1]=fillG;data[pos+2]=fillB;data[pos+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
 ctx.putImageData(imageData,0,0);
}
canvas.addEventListener('click',(e)=>{let p=getPos(e);floodFill(p.x,p.y,hexToRgba(currentColor));});
canvas.addEventListener('touchstart',(e)=>{e.preventDefault();let p=getPos(e);floodFill(p.x,p.y,hexToRgba(currentColor));},{passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);}
function saveImage(){let a=document.createElement('a');a.download='colored.png';a.href=canvas.toDataURL();a.click();}
</script>
