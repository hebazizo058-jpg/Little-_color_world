<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Little Color World</title><style>body{margin:0;font-family:Arial;background:#FFF8F0;text-align:center}header{background:white;padding:15px;font-weight:bold;position:sticky;top:0;z-index:10}.hero{padding:40px 20px;background:linear-gradient(135deg,#FFD93D,#FF6B9E,#7C5CFF);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px;max-width:500px;margin:auto}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 15px #0001}.btn{background:#7C5CFF;color:white;padding:12px 25px;border-radius:20px;border:none;font-size:16px;cursor:pointer}#pop{position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;display:none;justify-content:center;align-items:center;z-index:99;padding:15px}#popBox{background:white;padding:20px;border-radius:20px;width:95%;max-width:400px}#popBox svg{width:100%;height:auto;max-height:60vh;background:white;border:2px dashed #ccc}@media print{body *{display:none!important} #pop{display:flex!important;background:white!important} #popBox{box-shadow:none!important} #popBox button{display:none} #popBox svg{display:block!important}}</style></head><body><header>🎨 Little Color World</header><div class="hero"><h1>Color Your World! 🖍️</h1><p>Tap Print to get a real coloring page!</p></div><div class="grid"><div class="card">🐶<h3>Puppy</h3><button class="btn" onclick="openPrint('puppy')">Print</button></div><div class="card">🦄<h3>Unicorn</h3><button class="btn" onclick="openPrint('unicorn')">Print</button></div><div class="card">🦕<h3>Dino</h3><button class="btn" onclick="openPrint('dino')">Print</button></div><div class="card">👑<h3>Princess</h3><button class="btn" onclick="openPrint('princess')">Print</button></div></div><div id="pop" onclick="closePop()"><div id="popBox" onclick="event.stopPropagation()"><div id="imgWrap"></div><h3 id="pTitle"></h3><button class="btn" onclick="window.print()">🖨️ Print Now</button><br><br><button onclick="closePop()">Close</button></div></div><script>const pages={puppy:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="90" r="55" fill="none" stroke="black" stroke-width="3"/><ellipse cx="45" cy="70" rx="20" ry="30" fill="none" stroke="black" stroke-width="3"/><ellipse cx="155" cy="70" rx="20" ry="30" fill="none" stroke="black" stroke-width="3"/><circle cx="80" cy="85" r="6" fill="black"/><circle cx="120" cy="85" r="6" fill="black"/><ellipse cx="100" cy="110" rx="8" ry="6" fill="black"/><path d="M 85 125 Q 100 140 115 125" fill="none" stroke="black" stroke-width="2.5"/><path d="M 70 140 Q 100 170 130 140 L 130 180 L 70 180 Z" fill="none" stroke="black" stroke-width="3"/></svg>`,unicorn:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M 100 20 L 105 45 L 95 45 Z" fill="none" stroke="black" stroke-width="3"/><circle cx="100" cy="95" r="50" fill="none" stroke="black" stroke-width="3"/><path d="M 60 60 Q 100 30 140 60" fill="none" stroke="black" stroke-width="2"/><circle cx="80" cy="95" r="5" fill="black"/><circle cx="120" cy="95" r="5" fill="black"/><path d="M 90 115 Q 100 125 110 115" fill="none" stroke="black" stroke-width="2"/><path d="M 50 95 Q 20 100 30 130 Q 50 140 60 115" fill="none" stroke="black" stroke-width="3"/><path d="M 50 145 Q 100 180 150 145 L 150 180 L 50 180 Z" fill="none" stroke="black" stroke-width="3"/></svg>`,dino:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M 30 130 Q 50 110 60 130 L 160 75 L 150 110 L 100 115 L 80 150 L 40 150 Z" fill="none" stroke="black" stroke-width="3.5"/><circle cx="95" cy="80" r="5" fill="black"/><path d="M 110 60 L 120 35 L 135 40 L 125 65" fill="none" stroke="black" stroke-width="2.5"/><path d="M 70 90 Q 80 85 90 90" fill="none" stroke="black" stroke-width="2"/><path d="M 40 150 L 30 175 M 80 150 L 70 175" stroke="black" stroke-width="3" fill="none"/><path d="M 150 110 L 170 100 L 165 115 Z" fill="none" stroke="black" stroke-width="2.5"/></svg>`,princess:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="80" r="28" fill="none" stroke="black" stroke-width="3"/><path d="M 72 55 L 80 35 L 100 42 L 120 35 L 128 55 Z" fill="none" stroke="black" stroke-width="2.5"/><circle cx="72" cy="70" r="3" fill="black"/><circle cx="100" cy="65" r="4" fill="black"/><circle cx="128" cy="70" r="3" fill="black"/><circle cx="88" cy="82" r="3.5" fill="black"/><circle cx="112" cy="82" r="3.5" fill="black"/><path d="M 92 95 Q 100 102 108 95" fill="none" stroke="black" stroke-width="2"/><path d="M 75 108 Q 100 175 125 108" fill="none" stroke="black" stroke-width="3"/><path d="M 75 125 Q 100 135 125 125" fill="none" stroke="black" stroke-width="2" stroke-dasharray="4 3"/></svg>`};function openPrint(t){document.getElementById('imgWrap').innerHTML=pages[t];document.getElementById('pTitle').innerText=t+' Coloring Page';document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}</script></body></html>
