<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World</title>
<style>
body{margin:0;font-family:Arial;background:#FFF8F0;text-align:center}
header{background:white;padding:15px;font-weight:bold}
.hero{padding:50px 20px;background:linear-gradient(135deg,#FFD93D,#FF6B9E,#7C5CFF);color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px;max-width:500px;margin:auto}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 15px #0002}
.btn{background:#7C5CFF;color:white;padding:12px 25px;border-radius:20px;border:none;font-size:16px;cursor:pointer}
#pop{position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;display:none;justify-content:center;align-items:center;z-index:99}
#popBox{background:white;padding:20px;border-radius:20px;max-width:90%;width:350px}
#popBox img{width:100%}
</style></head><body>
<header>🎨 Little Color World</header>
<div class="hero"><h1>Color Your World! 🖍️</h1></div>
<div class="grid">
<div class="card">🐶<h3>Puppy</h3><button class="btn" onclick="openPrint('puppy')">Print</button></div>
<div class="card">🦄<h3>Unicorn</h3><button class="btn" onclick="openPrint('unicorn')">Print</button></div>
<div class="card">🦕<h3>Dino</h3><button class="btn" onclick="openPrint('dino')">Print</button></div>
<div class="card">👑<h3>Princess</h3><button class="btn" onclick="openPrint('princess')">Print</button></div>
</div>

<div id="pop" onclick="this.style.display='none'">
<div id="popBox" onclick="event.stopPropagation()">
<img id="pImg" src="">
<h3 id="pTitle"></h3>
<button class="btn" onclick="window.print()">🖨️ Print Now</button><br><br>
<button onclick="document.getElementById('pop').style.display='none'">Close</button>
</div></div>

<script>
function openPrint(t){
let pics={
puppy:"https://api.dicebear.com/9.x/bottts/svg?seed=puppy&backgroundColor=transparent",
unicorn:"https://api.dicebear.com/9.x/bottts/svg?seed=unicorn&backgroundColor=transparent",
dino:"https://api.dicebear.com/9.x/bottts/svg?seed=dino&backgroundColor=transparent",
princess:"https://api.dicebear.com/9.x/bottts/svg?seed=princess&backgroundColor=transparent"
};
// صور تلوين حقيقية للطباعة - خطوط سوداء
let coloring={
puppy:"https://www.coloringpages101.com/coloring-pages/Cartoon-Characters/Dog/Dog-46.jpg",
unicorn:"https://www.coloringpages101.com/coloring-pages/Cartoons/Unicorn/Unicorn-12.jpg",
dino:"https://www.coloringpages101.com/coloring-pages/Cartoon-Characters/Dinosaur/Dinosaur-1.jpg",
princess:"https://www.coloringpages101.com/coloring-pages/Princess/Princess-5.jpg"
};
document.getElementById('pImg').src=coloring[t];
document.getElementById('pTitle').innerText=t+" Coloring Page";
document.getElementById('pop').style.display='flex';
}
</script></body></html>
