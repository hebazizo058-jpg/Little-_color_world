<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World - عالم التلوين الصغير</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka','Baloo 2',sans-serif;background:#FFF7ED;overflow-x:hidden}
.hero{background:linear-gradient(135deg,#FF6B6B 0%,#FFE66D 50%,#4ECDC4 100%);padding:25px 15px 60px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'☁️ ☁️ ☁️';position:absolute;top:10px;left:0;right:0;font-size:28px;animation:clouds 20s linear infinite}
@keyframes clouds{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero h1{font-size:42px;color:white;text-shadow:0 4px 0 #ff4d4d,0 6px 12px rgba(0,0,0,.2);font-weight:800;letter-spacing:1px}
.hero h1 span{display:inline-block;animation:bounce 2s infinite}
.hero h1 span:nth-child(2){animation-delay:.1s}.hero h1 span:nth-child(3){animation-delay:.2s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero p{background:white;color:#FF6F00;padding:8px 18px;border-radius:20px;display:inline-block;margin-top:12px;font-weight:600;box-shadow:0 4px 0 #ffcc80}
.container{max-width:900px;margin:-35px auto 0;padding:0 15px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:white;border-radius:22px;padding:12px;border:4px solid #fff;box-shadow:0 8px 0 #FFE0B2,0 12px 24px rgba(0,0,0,.1);cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:0 12px 0 #FFCC80,0 18px 32px rgba(0,0,0,.15)}
.card img{width:100%;height:140px;object-fit:contain;background:#FFF8E1;border-radius:14px}
.card .title{margin-top:8px;font-weight:700;color:#5D4037;font-size:14px}
.card .badge{position:absolute;top:8px;left:8px;background:#4ECDC4;color:white;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700}
.badge.pink{background:#FF6B9D}.badge.yellow{background:#FFD93D;color:#5D4037}.badge.blue{background:#6BCB77}
.footer{text-align:center;padding:30px;color:#BCAAA4;font-size:13px}

/* Coloring Page */
#colorPage{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#FFF7ED,#FFE0B2);z-index:9999;overflow:auto;padding:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:0 auto;background:white;padding:8px 12px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:440px;margin:12px auto;background:white;padding:12px;border-radius:18px;box-shadow:0 6px 0 #FFE0B2}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid white;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer;transition:.15s}
.color.active{transform:scale(1.25);border-color:#000;box-shadow:0 0 0 3px #FFD93D}
#mainCanvas{background:white;border-radius:18px;display:block;margin:12px auto;max-width:95vw;max-height:58vh;box-shadow:0 8px 0 #FFCC80,0 12px 24px rgba(0,0,0,.15);cursor:pointer}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 18px;border:none;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.orange{background:#FF6F00;color:white}.btn.green{background:#4ECDC4;color:white}.btn.gray{background:#8D6E63;color:white}
</style>
</head>
<body>

<div id="homePage">
<div class="hero">
<h1><span>🎨</span> Little Color World <span>🌈</span></h1>
<p>✨ اختاري رسمة ودوسي جواها عشان تلونيها ✨</p>
</div>
<div class="container">
<div class="card-grid">
<div class="card" onclick="openColor('1_20261019_073454_0000.png')"><span class="badge">جديد!</span><img src="1_20261019_073454_0000.png"><div class="title">🦄 يونيكورن كيوت</div></div>
<div class="card" onclick="openColor('2_20261019_073454_0001.png')"><span class="badge pink">لطيف</span><img src="2_20261019_073454_0001.png"><div class="title">🐱 قطة صغيرة</div></div>
<div class="card" onclick="openColor('3_20261019_073455_0002.png')"><span class="badge yellow">ممتع</span><img src="3_20261019_073455_0002.png"><div class="title">🌸 زهرة جميلة</div></div>
<div class="card" onclick="openColor('4_20261019_073455_0003.png')"><span class="badge blue">رائع</span><img src="4_20261019_073455_0003.png"><div class="title">🚀 مغامرة فضاء</div></div>
<div class="card" onclick="openColor('6_20261019_073455_0005.png')"><span class="badge">جديد!</span><img src="6_20261019_073455_0005.png"><div class="title">🦁 ملك الغابة</div></div>
</div>
<div class="footer">صنع بحب لكل الأطفال المبدعين 💖 | 100 لون سحري في انتظارك</div>
</div>
</div>

<div id="colorPage">
<div class="topbar">
<button class="btn gray" onclick="closeColor()">⬅ رجوع</button>
<div style="font-weight:800;color:#FF6F00">🎨 لوني براحتك</div>
<div class="btns"><button class="btn gray" onclick="clearCanvas()">مسح</button><button class="btn green" onclick="saveImage()">حفظ 💾</button></div>
</div>
<div class="palette" id="pal"></div>
<canvas id="mainCanvas"></canvas>
</div>

<script>
const colors100=["#000000","#FFFFFF","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF","#8B0000","#FF3D00","#FF6E40","#FF9100","#FFAB00","#FFD600","#FFFF00","#EEFF41","#FFF9C4","#FFE0B2","#E91E63","#FF4081","#FF80AB","#FF8A80","#FF1744","#F50057","#EC407A","#F48FB1","#F06292","#E57373","#D32F2F","#C62828","#B71C1C","#EF9A9A","#FFAB91","#FF8A65","#8D6E63","#5D4037","#A1887F","#D7CCC8","#BCAAA4","#FFE0B2","#FFCC80","#FFE0B2","#FFF3E0","#FFF8E1","#FFFDE7","#F1F8E9","#DCEDC8","#00C853","#00BFA5","#00B8D4","#0091EA","#304FFE","#6200EA","#AA00FF","#D50000","#76FF03","#64DD17","#33691E","#558B2F","#9CCC65","#AED581","#C5E1A5","#CCFF90","#B2FF59","#69F0AE","#00BFA5","#26A69A","#00897B","#00695C","#004D40","#0D47A1","#1565C0","#1976D2","#1E88E5","#42A5F5","#90CAF9","#BBDEFB","#81D4FA","#4FC3F7","#26C6DA","#B2EBF2","#4A148C","#6A1B9A","#7B1FA2","#8E24AA","#AB47BC","#BA68C8","#CE93D8","#E1BEE7","#F3E5F5","#FCE4EC","#FF80AB"];
let pal=document.getElementById('pal'), current=colors100[2];
colors100.slice(0,100).forEach((c,i)=>{
 let d=document.createElement('div');d.className='color'+(i==2?' active':'');d.style.background=c;
 d.onclick=()=>{current=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};
 pal.appendChild(d);
});
let canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d'), imgObj=new Image();
function openColor(src){document.getElementById('homePage').style.display='none';document.getElementById('colorPage').style.display='block';imgObj.crossOrigin='anonymous';imgObj.src=src;imgObj.onload=()=>{canvas.width=imgObj.naturalWidth;canvas.height=imgObj.naturalHeight;ctx.drawImage(imgObj,0,0);}}
function closeColor(){document.getElementById('colorPage').style.display='none';document.getElementById('homePage').style.display='block';}
function hexToRgba(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function getPos(e){let r=canvas.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);return{x:Math.floor((x-r.left)*(canvas.width/r.width)),y:Math.floor((y-r.top)*(canvas.height/r.height))};}
function floodFill(sx,sy,fill){let d=ctx.getImageData(0,0,canvas.width,canvas.height),data=d.data,stack=[[sx,sy]],sp=(sy*canvas.width+sx)*4,sr=data[sp],sg=data[sp+1],sb=data[sp+2],[fr,fg,fb]=fill;if(sr===fr&&sg===fg&&sb===fb)return;let vis=new Uint8Array(canvas.width*canvas.height);function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<25&&g<25&&b<25)return false;return Math.abs(r-sr)<32&&Math.abs(g-sg)<32&&Math.abs(b-sb)<32;}while(stack.length){let [x,y]=stack.pop(),idx=y*canvas.width+x;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*canvas.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(d,0,0);}
canvas.addEventListener('click',e=>{let p=getPos(e);floodFill(p.x,p.y,hexToRgba(current));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);floodFill(p.x,p.y,hexToRgba(current));},{passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);}
function saveImage(){let a=document.createElement('a');a.download='my-art.png';a.href=canvas.toDataURL();a.click();}
</script>
</body>
</html>
