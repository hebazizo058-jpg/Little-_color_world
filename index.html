<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:20px 15px 45px;text-align:center}
.hero h1{color:#fff;font-size:26px;text-shadow:0 3px 0 #ff4d4d;font-weight:800}
.hero p{background:#fff;color:#FF6F00;padding:7px 14px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:700}
.container{max-width:950px;margin:-25px auto 0;padding:0 12px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 5px 0 #FFE0B2,0 8px 15px rgba(0,0,0,.08);cursor:pointer;text-align:center;border-top:6px solid #FF6B6B}
.card img{width:100%;height:120px;object-fit:contain;background:#FFF8E1;border-radius:10px}
.card .t{font-weight:800;color:#5D4037;font-size:12px;margin-top:6px}
.page{display:none}.page.active{display:block}
#paint{position:fixed;inset:0;background:#FFF7ED;z-index:99;display:none;padding:8px;text-align:center;overflow:auto}
.top{max-width:520px;margin:0 auto;background:#fff;padding:8px 10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:10px auto;background:#fff;padding:8px;border-radius:12px}
.c{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #888;cursor:pointer}.c.on{outline:2px solid #000;transform:scale(1.15)}
#cv{background:#fff;border-radius:12px;display:block;margin:10px auto;max-width:96vw}
.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:'Fredoka'}
.back{margin:12px 0;background:#fff;border:none;padding:8px 14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;font-weight:800;color:#FF6F00}
</style>
</head>
<body>
<div id="home" class="page active"><div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>دوسي على الرسمة الحلوة عشان تلونيها</p></div><div class="container"><div class="grid" id="grid"></div></div></div>
<div id="paint"><div class="top"><button class="btn" onclick="goHome()" style="background:#8D6E63;color:#fff">⬅ رجوع</button><b style="color:#FF6F00">لوني</b><div><button class="btn" onclick="clearC()" style="background:#8D6E63;color:#fff">مسح</button><button class="btn" onclick="saveC()" style="background:#4ECDC4;color:#fff">حفظ 💾</button></div></div><div class="pal" id="pal"></div><canvas id="cv"></canvas></div>
<script>
const ITEMS=[
{file:"mermaid.png",title:"Mermaid",emoji:"🧜‍♀️",color:"#81D4FA"},
{file:"dino.png",title:"Dino Party",emoji:"🦕",color:"#AED581"},
{file:"spider.png",title:"Spider Hero",emoji:"🕷️",color:"#EF5350"},
{file:"teddy.png",title:"Teddy Bear",emoji:"🧸",color:"#FFCC80"},
{file:"dory.png",title:"Dory Fish",emoji:"🐟",color:"#4FC3F7"},
];
const grid=document.getElementById('grid');
ITEMS.forEach((it,i)=>{let d=document.createElement('div');d.className='card';d.style.borderTopColor=it.color;d.innerHTML=`<img src="${it.file}" onerror="this.src='${it.file}?v=1'"><div class="t">${it.emoji} ${it.title}</div>`;d.onclick=()=>openPaint(i);grid.appendChild(d);});
const colors=["#000","#fff","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF"];
let curColor=colors[2];const pal=document.getElementById('pal');
colors.forEach((c,i)=>{let d=document.createElement('div');d.className='c'+(i==2?' on':'');d.style.background=c;d.onclick=()=>{curColor=c;document.querySelectorAll('.c').forEach(x=>x.classList.remove('on'));d.classList.add('on');};pal.appendChild(d);});
let cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),imgObj=new Image(),currentFile="";
function openPaint(i){currentFile=ITEMS[i].file;document.getElementById('paint').style.display='block';imgObj=new Image();imgObj.crossOrigin="anonymous";imgObj.src=currentFile;imgObj.onload=()=>{let maxW=Math.min(window.innerWidth*0.95,600),sc=maxW/imgObj.naturalWidth;cv.width=imgObj.naturalWidth;cv.height=imgObj.naturalHeight;cv.style.width=maxW+'px';cv.style.height=(imgObj.naturalHeight*sc)+'px';ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(imgObj,0,0);};}
function goHome(){document.getElementById('paint').style.display='none';}
function hexToRgba(h){if(h.length==4){h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];}return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function getPos(e){let r=cv.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.floor((cx-r.left)*(cv.width/r.width)),y:Math.floor((cy-r.top)*(cv.height/r.height))};}
function flood(sx,sy,fill){let d=ctx.getImageData(0,0,cv.width,cv.height),data=d.data,stack=[[sx,sy]],sp=(sy*cv.width+sx)*4,sr=data[sp],sg=data[sp+1],sb=data[sp+2],[fr,fg,fb]=fill;if(sr===fr&&sg===fg&&sb===fb)return;let vis=new Uint8Array(cv.width*cv.height);function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<25&&g<25&&b<25)return false;return Math.abs(r-sr)<35&&Math.abs(g-sg)<35&&Math.abs(b-sb)<35;}while(stack.length){let[x,y]=stack.pop(),idx=y*cv.width+x;if(x<0||x>=cv.width||y<0||y>=cv.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*cv.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(d,0,0);}
cv.addEventListener('click',e=>{let p=getPos(e);flood(p.x,p.y,hexToRgba(curColor));});
cv.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);flood(p.x,p.y,hexToRgba(curColor));},{passive:false});
function clearC(){ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(imgObj,0,0,cv.width,cv.height);}
function saveC(){let a=document.createElement('a');a.download='mariam-art.png';a.href=cv.toDataURL();a.click();}
</script></body></html>
