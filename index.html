<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World - Fill Mode</title>
<style>
body{font-family:Arial;background:#FFF8E1;text-align:center;margin:0;padding:15px}
h1{color:#FF6F00}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.gallery img{width:160px;height:160px;object-fit:contain;background:white;border-radius:15px;border:3px solid #FFCC80;padding:10px;cursor:pointer}
#colorPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF8E1;z-index:999;padding:10px;box-sizing:border-box;overflow:auto}
#mainCanvas{border:3px solid #FFCC80;border-radius:12px;background:white;touch-action:none;max-width:95vw;max-height:65vh;display:block;margin:15px auto;cursor:pointer}
.color{width:38px;height:38px;border-radius:50%;display:inline-block;margin:5px;border:3px solid #fff;box-shadow:0 0 4px #999;cursor:pointer}
.color.active{border:3px solid #000;transform:scale(1.25)}
button{padding:10px 16px;border:none;border-radius:10px;background:#FF6F00;color:white;font-weight:bold;cursor:pointer;margin:4px}
#backBtn{background:#888}
</style>
</head>
<body>
<div id="homePage">
<h1>Little Color World</h1>
<p>اختاري صورة ودوسي جواها عشان تلونيها</p>
<div class="gallery">
<img src="1_20261019_073454_0000.png" onclick="openColor(this.src)">
<img src="2_20261019_073454_0001.png" onclick="openColor(this.src)">
<img src="3_20261019_073455_0002.png" onclick="openColor(this.src)">
<img src="4_20261019_073455_0003.png" onclick="openColor(this.src)">
<img src="6_20261019_073455_0005.png" onclick="openColor(this.src)">
</div>
</div>

<div id="colorPage">
<button id="backBtn" onclick="closeColor()">⬅ رجوع</button>
<div>
<div class="color active" style="background:#000000" onclick="setColor('#000000',this)"></div>
<div class="color" style="background:#ff0000" onclick="setColor('#ff0000',this)"></div>
<div class="color" style="background:#ff9800" onclick="setColor('#ff9800',this)"></div>
<div class="color" style="background:#ffeb3b" onclick="setColor('#ffeb3b',this)"></div>
<div class="color" style="background:#4caf50" onclick="setColor('#4caf50',this)"></div>
<div class="color" style="background:#2196f3" onclick="setColor('#2196f3',this)"></div>
<div class="color" style="background:#9c27b0" onclick="setColor('#9c27b0',this)"></div>
<div class="color" style="background:#ff69b4" onclick="setColor('#ff69b4',this)"></div>
<div class="color" style="background:#795548" onclick="setColor('#795548',this)"></div>
<div class="color" style="background:#ffffff" onclick="setColor('#ffffff',this)"></div>
<button onclick="clearCanvas()">مسح</button>
<button onclick="saveImage()">حفظ 💾</button>
</div>
<p>اختاري لون ودوسي جوه الرسمة 👆</p>
<canvas id="mainCanvas"></canvas>
</div>

<script>
let canvas=document.getElementById('mainCanvas');
let ctx=canvas.getContext('2d');
let currentColor='#ff0000';
let imgObj=new Image();

function openColor(src){
 document.getElementById('homePage').style.display='none';
 document.getElementById('colorPage').style.display='block';
 imgObj.crossOrigin='anonymous';
 imgObj.src=src;
 imgObj.onload=()=>{
  canvas.width=imgObj.naturalWidth;
  canvas.height=imgObj.naturalHeight;
  ctx.drawImage(imgObj,0,0);
 }
}
function closeColor(){
 document.getElementById('colorPage').style.display='none';
 document.getElementById('homePage').style.display='block';
}
function setColor(c,el){
 currentColor=c;
 document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
}
function hexToRgba(hex){
 let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
 return [r,g,b,255];
}
function getPos(e){
 let rect=canvas.getBoundingClientRect();
 let clientX = e.touches ? e.touches[0].clientX : e.clientX;
 let clientY = e.touches ? e.touches[0].clientY : e.clientY;
 return {
  x: Math.floor((clientX - rect.left) * (canvas.width / rect.width)),
  y: Math.floor((clientY - rect.top) * (canvas.height / rect.height))
 }
}
function floodFill(startX,startY,fillColor){
 let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
 let data=imageData.data;
 let stack=[[startX,startY]];
 let startPos=(startY*canvas.width+startX)*4;
 let startR=data[startPos], startG=data[startPos+1], startB=data[startPos+2], startA=data[startPos+3];
 let [fillR,fillG,fillB,fillA]=fillColor;
 if(startR===fillR && startG===fillG && startB===fillB) return;
 let visited=new Uint8Array(canvas.width*canvas.height);
 function match(pos){
  let r=data[pos], g=data[pos+1], b=data[pos+2];
  // لو خط اسود غامق منعتبرهوش حدود مسموحة
  let isBlack = r<30 && g<30 && b<30;
  if(isBlack) return false;
  return Math.abs(r-startR)<25 && Math.abs(g-startG)<25 && Math.abs(b-startB)<25;
 }
 while(stack.length){
  let [x,y]=stack.pop();
  let idx=y*canvas.width+x;
  if(x<0||x>=canvas.width||y<0||y>=canvas.height) continue;
  if(visited[idx]) continue;
  visited[idx]=1;
  let pos=(y*canvas.width+x)*4;
  if(!match(pos)) continue;
  data[pos]=fillR; data[pos+1]=fillG; data[pos+2]=fillB; data[pos+3]=255;
  stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
 }
 ctx.putImageData(imageData,0,0);
}
canvas.addEventListener('click', (e)=>{
 let p=getPos(e);
 floodFill(p.x,p.y,hexToRgba(currentColor));
});
canvas.addEventListener('touchstart', (e)=>{
 e.preventDefault();
 let p=getPos(e);
 floodFill(p.x,p.y,hexToRgba(currentColor));
},{passive:false});

function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(imgObj,0,0,canvas.width,canvas.height); }
function saveImage(){ let a=document.createElement('a'); a.download='colored.png'; a.href=canvas.toDataURL(); a.click(); }
</script>
</body>
</html>
