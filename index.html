<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:24px 15px 55px;text-align:center}
.hero h1{font-size:26px;color:#fff;text-shadow:0 3px 0 #ff4d4d;font-weight:800}
.hero p{background:#fff;color:#FF6F00;padding:7px 16px;border-radius:20px;display:inline-block;margin-top:10px;font-weight:700}
.container{max-width:950px;margin:-30px auto 0;padding:0 12px 30px}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.folder{background:#fff;border-radius:20px;padding:16px 10px;text-align:center;box-shadow:0 6px 0 #FFE0B2,0 8px 20px rgba(0,0,0,.08);cursor:pointer;border-top:6px solid #FF6B6B}
.folder .icon{font-size:42px}.folder .title{font-weight:800;color:#5D4037;margin-top:6px;font-size:14px}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 0 #FFE0B2;cursor:pointer}.card img{width:100%;height:120px;object-fit:contain;background:#FFF8E1;border-radius:10px}
.page{display:none}.page.active{display:block}
#colorPage{position:fixed;inset:0;background:#FFF7ED;z-index:9999;overflow:auto;padding:8px;text-align:center;display:none}
.topbar{max-width:520px;margin:0 auto;background:#fff;padding:8px 10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:10px auto;background:#fff;padding:8px;border-radius:12px}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #888;cursor:pointer}.color.active{outline:2px solid #000;transform:scale(1.15)}
#mainCanvas{background:#fff;border-radius:12px;display:block;margin:10px auto;max-width:96vw}
.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:'Fredoka'}
.back{margin:12px 0;background:#fff;border:none;padding:8px 14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;font-weight:800;color:#FF6F00}
</style></head>
<body>
<div id="homePage" class="page active"><div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>دوسي على الرسمة عشان تلونيها</p></div><div class="container"><div class="folder-grid" id="folderGrid"></div><p id="loading" style="text-align:center;margin-top:20px;color:#FF6F00">بيحمل الصور... ⏳</p></div></div>
<div id="categoryPage" class="page"><div class="hero" style="padding-bottom:35px"><h1 id="catTitle"></h1></div><div class="container"><button class="back" onclick="showHome()">⬅ رجوع للملفات</button><div class="image-grid" id="imageGrid"></div></div></div>
<div id="colorPage"><div class="topbar"><button class="btn" style="background:#8D6E63;color:#fff" onclick="backToCat()">⬅ رجوع</button><b style="color:#FF6F00">لوني</b><div><button class="btn" style="background:#8D6E63;color:#fff" onclick="clearCanvas()">مسح</button><button class="btn" style="background:#4ECDC4;color:#fff" onclick="saveImage()">حفظ 💾</button></div></div><div class="palette" id="pal"></div><canvas id="mainCanvas"></canvas></div>
<script>
const FOLDERS=[
  {title:"Little Mermaid",emoji:"🧜‍♀️",color:"#81D4FA"},
  {title:"Dinosaurs",emoji:"🦕",color:"#AED581"},
  {title:"Spiderman",emoji:"🕷️",color:"#EF5350"},
  {title:"Superman",emoji:"🦸",color:"#42A5F5"},
  {title:"Teddy Bear",emoji:"🧸",color:"#FFCC80"},
  {title:"Dory",emoji:"🐟",color:"#4FC3F7"},
  {title:"Orca Whale",emoji:"🐋",color:"#90A4AE"},
  {title:"Unicorn",emoji:"🦄",color:"#CE93D8"},
  {title:"Cars",emoji:"🚗",color:"#FFAB91"},
  {title:"Princess",emoji:"👸",color:"#F48FB1"}
];
let allImages=[];
async function loadImages(){
  try{
    let res=await fetch('https://api.github.com/repos/hebazizo058-jpg/Little-_color_world/contents');
    let files=await res.json();
    allImages=files.filter(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name)).map(f=>f.name);
  }catch(e){
    allImages=["1_20261019_073434_0000.png","2_20261019_073434_0001.png","3_20261019_073434_0002.png","4_20261019_073434_0003.png","5_20261019_073434_0000.png","6_20261019_073434_0001.png","8_20261019_073434_0003.png","9_20261019_073434_0004.png","10_20261019_073413_0000.png","11_20261019_073413_0001.png","12_20261019_073413_0002.png"];
  }
  renderFolders();
}
function renderFolders(){
  document.getElementById('loading').style.display='none';
  const fg=document.getElementById('folderGrid'); fg.innerHTML='';
  FOLDERS.forEach((c,i)=>{
    if(i>=allImages.length) return;
    let d=document.createElement('div');d.className='folder';d.style.borderTopColor=c.color;
    d.innerHTML=`<div class="icon">${c.emoji}</div><div class="title">${c.title}</div><small style="color:#999">${allImages[i].slice(0,10)}...</small>`;
    d.onclick=()=>openCat(i); fg.appendChild(d);
  });
}
function showHome(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('homePage').classList.add('active');document.getElementById('colorPage').style.display='none';}
let curIdx=0;
function openCat(i){curIdx=i;document.getElementById('catTitle').textContent=FOLDERS[i].emoji+" "+FOLDERS[i].title;let g=document.getElementById('imageGrid');g.innerHTML="";let src=allImages[i];let card=document.createElement('div');card.className='card';card.innerHTML=`<img src="${src}" onerror="this.src='${src}?v=1'"><p style="font-size:11px;color:#999;overflow:hidden">${src}</p>`;card.onclick=()=>openColor(src);g.appendChild(card);document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('categoryPage').classList.add('active');document.getElementById('colorPage').style.display='none';}
function backToCat(){document.getElementById('colorPage').style.display='none';document.getElementById('categoryPage').classList.add('active');}
const colors=["#000","#FFF","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF"];
let pal=document.getElementById('pal'),cur=colors[2];
colors.forEach((c,i)=>{let d=document.createElement('div');d.className='color'+(i==2?' active':'');d.style.background=c;d.onclick=()=>{cur=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};pal.appendChild(d);});
let canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),imgObj=new Image();
function openColor(src){document.getElementById('colorPage').style.display='block';document.getElementById('categoryPage').classList.remove('active');document.getElementById('homePage').classList.remove('active');imgObj=new Image();imgObj.crossOrigin="anonymous";imgObj.src=src
