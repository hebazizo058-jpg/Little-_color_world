<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:24px 15px 55px;text-align:center}
.hero h1{font-size:26px;color:#fff;text-shadow:0 3px 0 #ff4d4d;font-weight:800}
.hero p{background:#fff;color:#FF6F00;padding:7px 16px;border-radius:20px;display:inline-block;margin-top:10px;font-weight:700;font-size:14px}
.container{max-width:950px;margin:-30px auto 0;padding:0 12px 30px}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.folder{background:#fff;border-radius:20px;padding:16px 10px;text-align:center;box-shadow:0 6px 0 #FFE0B2,0 8px 20px rgba(0,0,0,.08);cursor:pointer;transition:.15s;position:relative;border-top:6px solid #FF6B6B}
.folder:active{transform:scale(.97)}
.folder .icon{font-size:42px}
.folder .title{font-weight:800;color:#5D4037;margin-top:6px;font-size:14px}
.folder .count{position:absolute;top:8px;left:8px;background:#FF6B6B;color:#fff;font-size:10px;padding:3px 8px;border-radius:12px;font-weight:800}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 0 #FFE0B2;cursor:pointer}
.card img{width:100%;height:110px;object-fit:contain;background:#FFF8E1;border-radius:10px}
.page{display:none}.page.active{display:block}
#colorPage{position:fixed;inset:0;background:#FFF7ED;z-index:9999;overflow:auto;padding:8px;text-align:center;display:none}
.topbar{max-width:520px;margin:0 auto;background:#fff;padding:8px 10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:10px auto;background:#fff;padding:8px;border-radius:12px}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #888;cursor:pointer}
.color.active{outline:2px solid #000;transform:scale(1.15)}
#mainCanvas{background:#fff;border-radius:12px;display:block;margin:10px auto;max-width:96vw;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:'Fredoka'}
.back{margin:12px 0;background:#fff;border:none;padding:8px 14px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;font-weight:800;color:#FF6F00}
</style>
</head>
<body>

<div id="homePage" class="page active">
<div class="hero"><h1>🎨 Mariam's little color world 🌈 🎨</h1><p>دوسي على الرسمة عشان تلونيها</p></div>
<div class="container"><div class="folder-grid" id="folderGrid"></div></div>
</div>

<div id="categoryPage" class="page">
<div class="hero" style="padding-bottom:35px"><h1 id="catTitle"></h1></div>
<div class="container"><button class="back" onclick="showHome()">⬅ رجوع للملفات</button><div class="image-grid" id="imageGrid"></div></div>
</div>

<div id="colorPage">
<div class="topbar">
<button class="btn" style="background:#8D6E63;color:#fff" onclick="backToCat()">⬅ رجوع</button>
<b style="color:#FF6F00">لوني</b>
<div><button class="btn" style="background:#8D6E63;color:#fff" onclick="clearCanvas()">مسح</button>
<button class="btn" style="background:#4ECDC4;color:#fff" onclick="saveImage()">حفظ 💾</button></div>
</div>
<div class="palette" id="pal"></div>
<canvas id="mainCanvas"></canvas>
</div>

<script>
const CATS = [
  {title:"Little Mermaid",emoji:"🧜‍♀️",color:"#81D4FA",imgs:["1_20261019_073454_0000.png","2_20261019_073454_0001.png"]},
  {title:"Dinosaurs",emoji:"🦕",color:"#AED581",imgs:["4_20261019_073455_0003.png","6_20261019_073455_0005.png"]},
  {title:"Spiderman",emoji:"🕷️",color:"#EF5350",imgs:["1_20261019_073454_0000.png","4_20261019_073455_0003.png"]},
  {title:"Superman",emoji:"🦸",color:"#42A5F5",imgs:["2_20261019_073454_0001.png","3_20261019_073455_0002.png"]},
  {title:"Teddy Bear",emoji:"🧸",color:"#FFCC80",imgs:["3_20261019_073455_0002.png","6_20261019_073455_0005.png"]},
  {title:"Dory",emoji:"🐟",color:"#4FC3F7",imgs:["1_20261019_073454_0000.png","2_20261019_073454_0001.png","3_20261019_073455_0002.png"]},
  {title:"Orca Whale",emoji:"🐋",color:"#90A4AE",imgs:["4_20261019_073455_0003.png","6_20261019_073455_0005.png","1_20261019_073454_0000.png"]}
];

const fg=document.getElementById('folderGrid');
CATS.forEach((c,i)=>{
  let d=document.createElement('div');d.className='folder';d.style.borderTopColor=c.color;
  d.innerHTML=`<div class="count">${c.imgs.length} صور</div><div class="icon">${c.emoji}</div><div class="title">${c.title}</div>`;
  d.onclick=()=>openCat(i); fg.appendChild(d);
});

function showHome(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('homePage').classList.add('active');document.getElementById('colorPage').style.display='none';}
let curCat=null;
function openCat(i){
 curCat=CATS[i];
 document.getElementById('catTitle').textContent=curCat.emoji+" "+curCat.title;
 let g=document.getElementById('imageGrid'); g.innerHTML="";
 curCat.imgs.forEach(src=>{
   let card=document.createElement('div');card.className='card';
   card.innerHTML=`<img src="${src}" onerror="this.src='https://via.placeholder.com/150?text=No+Img'">`;
   card.onclick=()=>openColor(src); g.appendChild(card);
 });
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('categoryPage').classList.add('active');
 document.getElementById('colorPage').style.display='none';
 window.scrollTo(0,0);
}
function backToCat(){document.getElementById('colorPage').style.display='none';document.getElementById('categoryPage').classList.add('active');}

const colors=["#000000","#FFFFFF","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF","#FF3D00","#FF9100","#FFAB00","#FFD600","#FFFF00","#E91E63","#FF4081","#FF80AB","#FF1744","#8D6E63","#5D4037","#FFE0B2","#FFCC80","#DCEDC8","#00C853","#00BFA5","#0091EA","#304FFE","#6200EA","#AA00FF","#D50000","#76FF03","#33691E","#9CCC65","#B2FF59","#69F0AE","#26A69A","#004D40","#0D47A1","#1976D2","#42A5F5","#90CAF9","#81D4FA","#4FC3F7","#26C6DA","#B2EBF2","#4A148C","#7B1FA2","#AB47BC","#CE93D8","#F3E5F5","#FCE4EC","#FF80AB","#FFCCBC","#D1C4E9","#C8E6C9","#B2DFDB","#F0F4C3","#FFECB3","#D7CCC8","#E0E0E0","#FF6B6B","#FFE66D","#4ECDC4","#FF6B9D","#FFD93D","#6BCB77","#FF8A65","#BA68C8","#4DB6AC","#DCE775","#FFB74D","#90A4AE","#AED581","#FFAB91","#80CBC4","#FFF59D","#EF9A9A","#B39DDB","#A5D6A7","#FFCC80","#F48FB1","#9FA8DA","#80DEEA","#C5E1A5","#FFE082","#E6EE9C","#FFABAB","#DCEDC8","#F8BBD0","#B0BEC5"];
let pal=document.getElementById('pal'), cur=colors[2];
colors.slice(0,100).forEach((c,i)=>{let d=document.createElement('div');d.className='color'+(i==2?' active':'');d.style.background=c;d.onclick=()=>{cur=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};pal.appendChild(d);});
let canvas=document.getElementById('mainCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),imgObj=new Image();
function openColor(src){
 document.getElementById('colorPage').style.display='block';
 document.getElementById('categoryPage').classList.remove('active');
 document.getElementById('homePage').classList.remove('active');
 imgObj=new Image();imgObj.src=src;
 imgObj.onload=()=>{
  let maxW=Math.min(window.innerWidth*0.95,600),sc=maxW/imgObj.naturalWidth;
  canvas.width=imgObj.naturalWidth;canvas.height=imgObj.naturalHeight;
  canvas.style.width=maxW+"px";canvas.style.height=(imgObj.naturalHeight*sc)+"px";
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0);
 };
}
function hexToRgba(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function getPos(e){let r=canvas.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.floor((cx-r.left)*(canvas.width/r.width)),y:Math.floor((cy-r.top)*(canvas.height/r.height))};}
function floodFill(sx,sy,fill){let d=ctx.getImageData(0,0,canvas.width,canvas.height),data=d.data,stack=[[sx,sy]],sp=(sy*canvas.width+sx)*4,sr=data[sp],sg=data[sp+1],sb=data[sp+2],[fr,fg,fb]=fill;if(sr===fr&&sg===fg&&sb===fb)return;let vis=new Uint8Array(canvas.width*canvas.height);function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<25&&g<25&&b<25)return false;return Math.abs(r-sr)<35&&Math.abs(g-sg)<35&&Math.abs(b-sb)<35;}while(stack.length){let[x,y]=stack.pop(),idx=y*canvas.width+x;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*canvas.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(d,0,0);}
canvas.addEventListener('click',e=>{let p=getPos(e);floodFill(p.x,p.y,hexToRgba(cur));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);floodFill(p.x,p.y,hexToRgba(cur));},{passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);}
function saveImage(){let a=document.createElement('a');a.download='mariam-art.png';a.href=canvas.toDataURL();a.click();}
</script>
</body>
</html>
