<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:20px;text-align:center}
.hero h1{color:#fff;font-size:22px;text-shadow:0 2px 0 #ff4d4d}.hero p{background:#fff;color:#FF6F00;padding:6px 12px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:500px;margin:-20px auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:0 5px 0 #FFE0B2;cursor:pointer;border-top:6px solid #FF6B6B}
.card .i{font-size:40px}.card .t{font-weight:800;color:#5D4037;font-size:13px;margin-top:4px}
#paint{position:fixed;inset:0;background:#FFF7ED;z-index:99;display:none;padding:8px;text-align:center;overflow:auto}
.top{max-width:500px;margin:0 auto;background:#fff;padding:8px;border-radius:12px;display:flex;justify-content:space-between}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:400px;margin:8px auto;background:#fff;padding:8px;border-radius:12px}
.c{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #888;cursor:pointer}.c.on{outline:2px solid #000;transform:scale(1.15)}
canvas{background:#fff;border-radius:12px;display:block;margin:8px auto;max-width:95vw;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn{padding:6px 10px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:'Fredoka'}
</style></head><body>
<div id="home"><div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>دوسي على الرسمة عشان تلونيها</p></div><div class="grid" id="grid"></div></div>
<div id="paint"><div class="top"><button class="btn" onclick="goHome()" style="background:#8D6E63;color:#fff">⬅ رجوع</button><b style="color:#FF6F00">لوني</b><div><button class="btn" onclick="clearC()" style="background:#8D6E63;color:#fff">مسح</button><button class="btn" onclick="saveC()" style="background:#4ECDC4;color:#fff">حفظ 💾</button></div></div><div class="pal" id="pal"></div><canvas id="cv"></canvas></div>
<script>
const PAGES=[
{emoji:"🧜‍♀️",title:"Mermaid",color:"#81D4FA",draw:(ctx,w,h)=>{ctx.lineWidth=6;ctx.lineCap="round";ctx.strokeStyle="#000";ctx.beginPath();ctx.arc(w*0.5,h*0.4,80,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w*0.5,h*0.6,w*0.3,0,Math.PI*2);ctx.stroke();}},
{emoji:"🦕",title:"Dino",color:"#AED581",draw:(ctx,w,h)=>{ctx.lineWidth=6;ctx.strokeStyle="#000";ctx.beginPath();ctx.arc(w*0.5,h*0.5,90,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w*0.35,h*0.35,15,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w*0.65,h*0.35,15,0,Math.PI*2);ctx.stroke();}},
{emoji:"🕷️",title:"Spider Hero",color:"#EF5350",draw:(ctx,w,h)=>{ctx.lineWidth=6;ctx.strokeStyle="#000";ctx.beginPath();ctx.arc(w*0.5,h*0.4,70,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.rect(w*0.35,h*0.6,w*0.3,h*0.25);ctx.stroke();}},
{emoji:"🧸",title:"Teddy",color:"#FFCC80",draw:(ctx,w,h)=>{ctx.lineWidth=6;ctx.strokeStyle="#000";ctx.beginPath();ctx.arc(w*0.5,h*0.4,60,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w*0.35,h*0.3,20,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(w*0.65,h*0.3,20,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(w*0.5,h*0.65,60,50,0,0,Math.PI*2);ctx.stroke();}},
{emoji:"🐟",title:"Dory",color:"#4FC3F7",draw:(ctx,w,h)=>{ctx.lineWidth=6;ctx.strokeStyle="#000";ctx.beginPath();ctx.ellipse(w*0.5,h*0.5,100,60,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(w*0.2,h*0.5);ctx.lineTo(w*0.05,h*0.3);ctx.lineTo(w*0.05,h*0.7);ctx.closePath();ctx.stroke();}}
];
const grid=document.getElementById('grid');
PAGES.forEach((p,i)=>{let d=document.createElement('div');d.className='card';d.style.borderTopColor=p.color;d.innerHTML=`<div class="i">${p.emoji}</div><div class="t">${p.title}</div>`;d.onclick=()=>openPaint(i);grid.appendChild(d);});
const colors=["#000","#fff","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF"];
let curColor=colors[2];const pal=document.getElementById('pal');
colors.forEach((c,i)=>{let d=document.createElement('div');d.className='c'+(i==2?' on':'');d.style.background=c;d.onclick=()=>{curColor=c;document.querySelectorAll('.c').forEach(x=>x.classList.remove('on'));d.classList.add('on');};pal.appendChild(d);});
let cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),currentDraw=null;
function openPaint(i){document.getElementById('paint').style.display='block';currentDraw=PAGES[i].draw;let size=Math.min(window.innerWidth*0.9,500);cv.width=size*2;cv.height=size*2;cv.style.width=size+'px';cv.style.height=size+'px';ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(2,2);currentDraw(ctx,size/2,size/2);ctx.restore();}
function goHome(){document.getElementById('paint').style.display='none';}
function hexToRgba(h){if(h.length==4){h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];}return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function getPos(e){let r=cv.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.floor((cx-r.left)*(cv.width/r.width)),y:Math.floor((cy-r.top)*(cv.height/r.height))};}
function flood(sx,sy,fill){let d=ctx.getImageData(0,0,cv.width,cv.height),data=d.data,stack=[[sx,sy]],sp=(sy*cv.width+sx)*4,sr=data[sp],sg=data[sp+1],sb=data[sp+2],[fr,fg,fb]=fill;if(sr===fr&&sg===fg&&sb===fb)return;let vis=new Uint8Array(cv.width*cv.height);function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<30&&g<30&&b<30)return false;return Math.abs(r-sr)<35&&Math.abs(g-sg)<35&&Math.abs(b-sb)<35;}while(stack.length){let[x,y]=stack.pop(),idx=y*cv.width+x;if(x<0||x>=cv.width||y<0||y>=cv.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*cv.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(d,0,0);}
cv.addEventListener('click',e=>{let p=getPos(e);flood(p.x,p.y,hexToRgba(curColor));});
cv.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);flood(p.x,p.y,hexToRgba(curColor));},{passive:false});
function clearC(){let size=cv.width/2;ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(2,2);currentDraw(ctx,size/2,size/2);ctx.restore();}
function saveC(){let a=document.createElement('a');a.download='mariam.png';a.href=cv.toDataURL();a.click();}
</script></body></html>
