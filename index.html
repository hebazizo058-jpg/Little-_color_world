<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World</title>
<style>
body{font-family:Arial;background:#FFF8E1;text-align:center;margin:0;padding:15px}
h1{color:#FF6F00}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.gallery img{width:160px;height:160px;object-fit:contain;background:white;border-radius:15px;border:3px solid #FFCC80;padding:10px;cursor:pointer}
#colorPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF8E1;z-index:999;padding:10px;box-sizing:border-box;overflow:auto}
#mainCanvas{border:3px solid #FFCC80;border-radius:12px;background:white;touch-action:none;max-width:95vw;max-height:65vh;display:block;margin:15px auto}
.color{width:32px;height:32px;border-radius:50%;display:inline-block;margin:4px;border:2px solid #fff;box-shadow:0 0 3px #999;cursor:pointer;vertical-align:middle}
.color.active{border:3px solid #000;transform:scale(1.2)}
button{padding:8px 14px;border:none;border-radius:8px;background:#FF6F00;color:white;font-weight:bold;cursor:pointer;margin:3px}
#backBtn{background:#888}
</style>
</head>
<body>
<div id="homePage">
<h1>Little Color World</h1>
<p>اختاري صورة عشان تلونيها</p>
<div class="gallery">
<img src="1_20261019_073454_0000.png" onclick="openColor(this.src)">
<img src="2_20261019_073454_0001.png" onclick="openColor(this.src)">
<img src="3_20261019_073455_0002.png" onclick="openColor(this.src)">
<img src="4_20261019_073455_0003.png" onclick="openColor(this.src)">
<img src="6_20261019_073455_0005.png" onclick="openColor(this.src)">
</div>
</div>

<div id="colorPage">
<button id="backBtn" onclick="closeColor()">⬅ رجوع</button>
<div>
<div class="color active" style="background:#000000" onclick="setColor('#000000',this)"></div>
<div class="color" style="background:#ff0000" onclick="setColor('#ff0000',this)"></div>
<div class="color" style="background:#ff9800" onclick="setColor('#ff9800',this)"></div>
<div class="color" style="background:#ffeb3b" onclick="setColor('#ffeb3b',this)"></div>
<div class="color" style="background:#4caf50" onclick="setColor('#4caf50',this)"></div>
<div class="color" style="background:#2196f3" onclick="setColor('#2196f3',this)"></div>
<div class="color" style="background:#9c27b0" onclick="setColor('#9c27b0',this)"></div>
<div class="color" style="background:#ffffff;border:1px solid #ccc" onclick="setColor('#ffffff',this)"></div>
<button onclick="clearCanvas()">مسح</button>
<button onclick="saveImage()">حفظ</button>
<br> حجم الفرشة: <input type="range" id="size" min="2" max="30" value="8">
</div>
<canvas id="mainCanvas" width="800" height="800"></canvas>
</div>

<script>
let canvas=document.getElementById('mainCanvas');
let ctx=canvas.getContext('2d');
let painting=false;
let currentColor='#000000';
let imgObj=new Image();

function openColor(src){
 document.getElementById('homePage').style.display='none';
 document.getElementById('colorPage').style.display='block';
 imgObj.src=src;
 imgObj.onload=()=>{
  canvas.width=imgObj.naturalWidth;
  canvas.height=imgObj.naturalHeight;
  ctx.fillStyle='white';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);
 }
}
function closeColor(){
 document.getElementById('colorPage').style.display='none';
 document.getElementById('homePage').style.display='block';
}
function setColor(c,el){
 currentColor=c;
 document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
}
function getPos(e){
 let rect=canvas.getBoundingClientRect();
 let clientX = e.touches ? e.touches[0].clientX : e.clientX;
 let clientY = e.touches ? e.touches[0].clientY : e.clientY;
 return {
  x: (clientX - rect.left) * (canvas.width / rect.width),
  y: (clientY - rect.top) * (canvas.height / rect.height)
 }
}
canvas.addEventListener('mousedown', (e)=>{ painting=true; let p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
canvas.addEventListener('mouseup', ()=>{ painting=false; ctx.beginPath(); });
canvas.addEventListener('mousemove', (e)=>{
 if(!painting) return;
 let p=getPos(e);
 ctx.lineWidth=document.getElementById('size').value;
 ctx.lineCap='round';
 ctx.lineJoin='round';
 ctx.strokeStyle=currentColor;
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
});
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); painting=true; let p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); },{passive:false});
canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); painting=false; ctx.beginPath(); },{passive:false});
canvas.addEventListener('touchmove', (e)=>{
 e.preventDefault();
 if(!painting) return;
 let p=getPos(e);
 ctx.lineWidth=document.getElementById('size').value;
 ctx.lineCap='round';
 ctx.lineJoin='round';
 ctx.strokeStyle=currentColor;
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
},{passive:false});

function clearCanvas(){
 ctx.fillStyle='white';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);
}
function saveImage(){
 let a=document.createElement('a');
 a.download='my-coloring.png';
 a.href=canvas.toDataURL();
 a.click();
}
</script>
</body>
</html>
