<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Colors</title>
<style>
body{font-family:Arial;background:#FFF8E1;text-align:center;margin:0;padding:15px}
h1{color:#FF6F00}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.gallery img{width:140px;height:140px;object-fit:contain;background:white;border-radius:12px;border:3px solid #FFCC80;padding:8px;cursor:pointer}
#colorPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF8E1;z-index:999;padding:8px;box-sizing:border-box;overflow:auto}
#mainCanvas{border:3px solid #FFCC80;border-radius:12px;background:white;max-width:95vw;max-height:55vh;display:block;margin:10px auto;cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(10, 1fr);gap:5px;max-width:420px;margin:10px auto;background:white;padding:10px;border-radius:12px;border:2px solid #FFCC80}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 2px #999;cursor:pointer}
.color.active{border:3px solid #000;transform:scale(1.2)}
button{padding:8px 14px;border:none;border-radius:8px;background:#FF6F00;color:white;font-weight:bold;margin:3px}
#backBtn{background:#888}
</style>
</head>
<body>
<div id="homePage">
<h1>Little Color World</h1>
<div class="gallery">
<img src="1_20261019_073454_0000.png" onclick="openColor(this.src)">
<img src="2_20261019_073454_0001.png" onclick="openColor(this.src)">
<img src="3_20261019_073455_0002.png" onclick="openColor(this.src)">
<img src="4_20261019_073455_0003.png" onclick="openColor(this.src)">
<img src="6_20261019_073455_0005.png" onclick="openColor(this.src)">
</div>
</div>

<div id="colorPage">
<button id="backBtn" onclick="closeColor()">⬅ رجوع</button>
<div class="palette" id="pal"></div>
<button onclick="clearCanvas()">مسح</button>
<button onclick="saveImage()">حفظ 💾</button>
<canvas id="mainCanvas"></canvas>
</div>

<script>
const colors100=["#000000","#FFFFFF","#FF0000","#00FF00","#0000FF","#FFFF00","#FF00FF","#00FFFF","#FF8000","#8000FF","#8B0000","#FF4500","#FF6347","#FF7F50","#FF8C00","#FFA500","#FFD700","#FFFF99","#FFFACD","#FFE4B5","#FF1493","#FF69B4","#FFB6C1","#FFC0CB","#FF00AA","#C71585","#DB7093","#F08080","#FA8072","#E9967A","#FF0000","#DC143C","#B22222","#CD5C5C","#F4A460","#D2691E","#A52A2A","#8B4513","#A0522D","#D2B48C","#DEB887","#F5DEB3","#FFEFD5","#FFDEAD","#FFDAB9","#FFE4C4","#FAEBD7","#FFF8DC","#FFF0F5","#00FF7F","#00FA9A","#00FF00","#32CD32","#228B22","#008000","#006400","#90EE90","#98FB98","#ADFF2F","#7FFF00","#7CFC00","#6B8E23","#808000","#9ACD32","#556B2F","#66CDAA","#8FBC8F","#2E8B57","#3CB371","#20B2AA","#2F4F4F","#008080","#000080","#00008B","#0000CD","#191970","#4169E1","#1E90FF","#00BFFF","#87CEEB","#87CEFA","#4682B4","#5F9EA0","#6495ED","#B0C4DE","#ADD8E6","#B0E0E6","#AFEEEE","#E0FFFF","#4B0082","#483D8B","#6A5ACD","#7B68EE","#9370DB","#8A2BE2","#9400D3","#9932CC","#BA55D3","#DA70D6","#EE82EE","#DDA0DD","#DA70D6","#FF00FF"];
let palDiv=document.getElementById('pal');
let currentColor=colors100[2];
colors100.slice(0,100).forEach((c,i)=>{
 let d=document.createElement('div');
 d.className='color'+(i==2?' active':'');
 d.style.background=c;
 d.onclick=function(){currentColor=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};
 palDiv.appendChild(d);
});

let canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d'), imgObj=new Image();
function openColor(src){document.getElementById('homePage').style.display='none';document.getElementById('colorPage').style.display='block';imgObj.crossOrigin='anonymous';imgObj.src=src;imgObj.onload=()=>{canvas.width=imgObj.naturalWidth;canvas.height=imgObj.naturalHeight;ctx.drawImage(imgObj,0,0);}}
function closeColor(){document.getElementById('colorPage').style.display='none';document.getElementById('homePage').style.display='block';}
function hexToRgba(hex){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return [r,g,b,255];}
function getPos(e){let rect=canvas.getBoundingClientRect();let cx=e.touches?e.touches[0].clientX:e.clientX;let cy=e.touches?e.touches[0].clientY:e.clientY;return{x:Math.floor((cx-rect.left)*(canvas.width/rect.width)),y:Math.floor((cy-rect.top)*(canvas.height/rect.height))}}
function floodFill(sx,sy,fill){
 let imgData=ctx.getImageData(0,0,canvas.width,canvas.height), data=imgData.data, stack=[[sx,sy]], sPos=(sy*canvas.width+sx)*4, sr=data[sPos], sg=data[sPos+1], sb=data[sPos+2], [fr,fg,fb]=fill;
 if(sr===fr&&sg===fg&&sb===fb)return; let vis=new Uint8Array(canvas.width*canvas.height);
 function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<25&&g<25&&b<25)return false;return Math.abs(r-sr)<30&&Math.abs(g-sg)<30&&Math.abs(b-sb)<30;}
 while(stack.length){let [x,y]=stack.pop(), idx=y*canvas.width+x;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*canvas.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
 ctx.putImageData(imgData,0,0);
}
canvas.addEventListener('click',e=>{let p=getPos(e);floodFill(p.x,p.y,hexToRgba(currentColor));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);floodFill(p.x,p.y,hexToRgba(currentColor));},{passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);}
function saveImage(){let a=document.createElement('a');a.download='colored.png';a.href=canvas.toDataURL();a.click();}
</script>
</body>
</html>
