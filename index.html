<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:25px 15px 60px;text-align:center}
.hero h1{font-size:32px;color:white;text-shadow:0 3px 0 #ff4d4d;font-weight:800}
.hero p{background:white;color:#FF6F00;padding:7px 16px;border-radius:20px;display:inline-block;margin-top:10px;font-weight:600}
.container{max-width:900px;margin:-35px auto 0;padding:0 15px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:white;border-radius:20px;padding:10px;box-shadow:0 6px 0 #FFE0B2;cursor:pointer;transition:.2s;text-align:center}
.card:hover{transform:translateY(-6px)}
.card img{width:100%;height:130px;object-fit:contain;background:#FFF8E1;border-radius:12px}
.card .title{margin-top:6px;font-weight:700;color:#5D4037;font-size:13px}
#colorPage{display:none;position:fixed;inset:0;background:#FFF7ED;z-index:9999;overflow:auto;padding:10px;text-align:center}
.topbar{max-width:500px;margin:0 auto;background:white;padding:8px 12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:430px;margin:12px auto;background:white;padding:10px;border-radius:16px;box-shadow:0 4px 0 #FFE0B2}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #999;cursor:pointer}
.color.active{border:2px solid #000;transform:scale(1.2)}
#mainCanvas{background:white;border-radius:16px;display:block;margin:12px auto;max-width:95vw;max-height:55vh;box-shadow:0 6px 12px rgba(0,0,0,.15);cursor:pointer}
.btn{padding:8px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="homePage">
<div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>اختاري رسمة ودوسي جواها عشان تلونيها</p></div>
<div class="container"><div class="card-grid">
<div class="card" onclick="openColor('1_20261019_073454_0000.png')"><img src="1_20261019_073454_0000.png"><div class="title">🦄 يونيكورن</div></div>
<div class="card" onclick="openColor('2_20261019_073454_0001.png')"><img src="2_20261019_073454_0001.png"><div class="title">🐱 قطة</div></div>
<div class="card" onclick="openColor('3_20261019_073455_0002.png')"><img src="3_20261019_073455_0002.png"><div class="title">🌸 زهرة</div></div>
<div class="card" onclick="openColor('4_20261019_073455_0003.png')"><img src="4_20261019_073455_0003.png"><div class="title">🚀 فضاء</div></div>
<div class="card" onclick="openColor('6_20261019_073455_0005.png')"><img src="6_20261019_073455_0005.png"><div class="title">🦁 أسد</div></div>
</div></div>
</div>
<div id="colorPage">
<div class="topbar">
<button class="btn" style="background:#8D6E63;color:white" onclick="closeColor()">⬅ رجوع</button>
<b style="color:#FF6F00">لوني براحتك</b>
<div><button class="btn" style="background:#8D6E63;color:white" onclick="clearCanvas()">مسح</button>
<button class="btn" style="background:#4ECDC4;color:white" onclick="saveImage()">حفظ 💾</button></div>
</div>
<div class="palette" id="pal"></div>
<canvas id="mainCanvas"></canvas>
</div>
