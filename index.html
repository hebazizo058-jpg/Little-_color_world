<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Color World</title>
<style>
body{font-family:Arial;background:#FFF8E1;text-align:center;margin:0;padding:15px}
h1{color:#FF6F00;margin-bottom:5px}
.gallery{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin-top:20px}
.gallery img{width:160px;height:160px;object-fit:contain;background:white;border-radius:15px;border:3px solid #FFCC80;padding:10px;cursor:pointer}
#colorPage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#FFF8E1;z-index:10;padding:10px;box-sizing:border-box}
#toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.color{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #999;cursor:pointer}
.color.active{border:3px solid #000;transform:scale(1.2)}
button{padding:8px 14px;border:none;border-radius:8px;background:#FF6F00;color:white;font-weight:bold;cursor:pointer}
#canvasWrap{position:relative;display:inline-block;touch-action:none}
#mainCanvas{border:3px solid #FFCC80;border-radius:12px;background:white;max-width:95vw;max-height:60vh;cursor:crosshair}
#backBtn{background:#888}
</style>
</head>
<body>

<div id="homePage">
<h1>Little Color World</h1>
<p>اختاري صورة عشان تلونيها</p>
<div class="gallery">
<img src="1_20261019_073454_0000.png" onclick="openColor(this.src)">
<img src="2_20261019_073454_0001.png" onclick="openColor(this.src)">
<img src="3_20261019_073455_0002.png" onclick="openColor(this.src)">
<img src="4_20261019_073455_0003.png" onclick="openColor(this.src)">
<img src="6_20261019_073455_0005.png" onclick="openColor(this.src)">
</div>
</div>

<div id="colorPage">
<button id="backBtn" onclick="closeColor()">⬅ رجوع</button>
<div id="toolbar">
<div class="color active" style="background:#000" onclick="setColor('#000',this)"></div>
<div class="color" style="background:#ff0000" onclick="setColor('#ff0000',this)"></div>
<div class="color" style="background:#ff9800" onclick="setColor('#ff9800',this)"></div>
<div class="color" style="background:#ffeb3b" onclick="setColor('#ffeb3b',this)"></div>
<div class="color" style="background:#4caf50" onclick="setColor('#4caf50',this)"></div>
<div class="color" style="background:#2196f3" onclick="setColor('#2196f3',this)"></div>
<div class="color" style="background:#9c27b0" onclick="setColor('#9c27b0',this)"></div>
<div class="color" style="background:#795548" onclick="setColor('#795548',this)"></div>
<div class="color" style="background:#ffffff" onclick="setColor('#ffffff',this)"></div>
<button onclick="clearCanvas()">مسح 🗑️</button>
<button onclick="saveImage()">حفظ 💾</button>
<input type="range" id="size" min="2" max="25" value="6">
</div>
<div id="canvasWrap">
<canvas id="mainCanvas"></canvas>
</div>
</div>

<script>
let canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
let painting=false, currentColor='#000';
let imgObj=new Image();

function openColor(src){
 document.getElementById('homePage').style.display='none';
 document.getElementById('colorPage').style.display='block';
 imgObj.src=src;
 imgObj.onload=()=>{
   canvas.width=imgObj.width;
   canvas.height=imgObj.height;
   ctx.fillStyle='white'; ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(imgObj,0,0);
 }
}
function closeColor(){ document.getElementById('colorPage').style.display='none'; document.getElementById('homePage').style.display='block';}
function setColor(c,el){ currentColor=c; document.querySelectorAll('.color').forEach(x=>x.classList.remove('active')); el.classList.add('active');}
function getPos(e){
 let rect=canvas.getBoundingClientRect();
 let t=e.touches?e.touches[0]:e;
 return {x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height)}
}
function start(e){ painting=true; draw(e); }
function end(){ painting=false; ctx.beginPath(); }
function draw(e){
 if(!painting) return;
 e.preventDefault();
 let p=getPos(e);
 ctx.lineWidth=document.getElementById('size').value;
 ctx.lineCap='round'; ctx.strokeStyle=currentColor;
 ctx.lineTo(p.x,p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x,p.y);
}
canvas.addEventListener('mousedown',start); canvas.addEventListener('mouseup',end); canvas.addEventListener('mousemove',draw);
canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchend',end); canvas.addEventListener('touchmove',draw,{passive:false});
function clearCanvas(){ ctx.fillStyle='white'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(imgObj,0,0); }
function saveImage(){ let a=document.createElement('a'); a.download='colored.png'; a.href=canvas.toDataURL(); a.click(); }
</script>
</body>
</html>
