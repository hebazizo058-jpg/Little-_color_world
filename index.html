<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:22px 15px 55px;text-align:center}
.hero h1{font-size:30px;color:white;text-shadow:0 3px 0 #ff4d4d;font-weight:800}
.hero p{background:white;color:#FF6F00;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:600;font-size:14px}
.container{max-width:900px;margin:-30px auto 0;padding:0 12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:white;border-radius:18px;padding:8px;box-shadow:0 5px 0 #FFE0B2;cursor:pointer;text-align:center}
.card img{width:100%;height:120px;object-fit:contain;background:#FFF8E1;border-radius:10px}
.card .title{margin-top:5px;font-weight:700;color:#5D4037;font-size:12px}
#colorPage{display:none;position:fixed;inset:0;background:#FFF7ED;z-index:9999;overflow:auto;padding:10px;text-align:center}
.topbar{max-width:500px;margin:0 auto;background:white;padding:8px 12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:430px;margin:10px auto;background:white;padding:10px;border-radius:16px}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #999;cursor:pointer}
.color.active{outline:2px solid #000;transform:scale(1.15)}
#mainCanvas{background:white;border-radius:16px;display:block;margin:10px auto;max-width:95vw;max-height:60vh;box-shadow:0 6px 12px rgba(0,0,0,.15)}
.btn{padding:8px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="homePage">
<div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>دوسي على أي رسمة عشان تلونيها</p></div>
<div class="container"><div class="card-grid">
<div class="card" onclick="openColor(this)"><img src="1_20261019_073454_0000.png"><div class="title">يونيكورن</div></div>
<div class="card" onclick="openColor(this)"><img src="2_20261019_073454_0001.png"><div class="title">قطة</div></div>
<div class="card" onclick="openColor(this)"><img src="3_20261019_073455_0002.png"><div class="title">زهرة</div></div>
<div class="card" onclick="openColor(this)"><img src="4_20261019_073455_0003.png"><div class="title">فضاء</div></div>
<div class="card" onclick="openColor(this)"><img src="6_20261019_073455_0005.png"><div class="title">أسد</div></div>
</div></div>
</div>

<div id="colorPage">
<div class="topbar">
<button class="btn" style="background:#8D6E63;color:white" onclick="closeColor()">⬅ رجوع</button>
<b style="color:#FF6F00">لوني</b>
<div><button class="btn" style="background:#8D6E63;color:white" onclick="clearCanvas()">مسح</button>
<button class="btn" style="background:#4ECDC4;color:white" onclick="saveImage()">حفظ</button></div>
</div>
<div class="palette" id="pal"></div>
<canvas id="mainCanvas"></canvas>
<p id="msg" style="color:#8D6E63;font-size:12px;margin-top:8px">دوسي جوه الرسمة عشان تلوني</p>
</div>

<script>
const colors100=["#000000","#FFFFFF","#FF0000","#00E676","#2962FF","#FFEB3B","#FF00FF","#00E5FF","#FF6D00","#7C4DFF","#8B0000","#FF3D00","#FF6E40","#FF9100","#FFAB00","#FFD600","#FFFF00","#EEFF41","#FFF9C4","#FFE0B2","#E91E63","#FF4081","#FF80AB","#FF8A80","#FF1744","#F50057","#EC407A","#F48FB1","#F06292","#E57373","#D32F2F","#C62828","#B71C1C","#EF9A9A","#FFAB91","#FF8A65","#8D6E63","#5D4037","#A1887F","#D7CCC8","#BCAAA4","#FFE0B2","#FFCC80","#FFF3E0","#FFF8E1","#FFFDE7","#F1F8E9","#DCEDC8","#00C853","#00BFA5","#00B8D4","#0091EA","#304FFE","#6200EA","#AA00FF","#D50000","#76FF03","#64DD17","#33691E","#558B2F","#9CCC65","#AED581","#C5E1A5","#CCFF90","#B2FF59","#69F0AE","#00BFA5","#26A69A","#00897B","#00695C","#004D40","#0D47A1","#1565C0","#1976D2","#1E88E5","#42A5F5","#90CAF9","#BBDEFB","#81D4FA","#4FC3F7","#26C6DA","#B2EBF2","#4A148C","#6A1B9A","#7B1FA2","#8E24AA","#AB47BC","#BA68C8","#CE93D8","#E1BEE7","#F3E5F5","#FCE4EC","#FF80AB"];
let pal=document.getElementById('pal'); let current=colors100[2];
colors100.forEach((c,i)=>{let d=document.createElement('div');d.className='color'+(i==2?' active':'');d.style.background=c;d.onclick=()=>{current=c;document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));d.classList.add('active');};pal.appendChild(d);});
let canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d'), imgObj=new Image();

function openColor(cardEl){
 let img = cardEl.querySelector('img');
 let src = img.src;
 document.getElementById('homePage').style.display='none';
 document.getElementById('colorPage').style.display='block';
 document.getElementById('msg').innerText = 'جاري تحميل الرسمة...';
 imgObj = new Image();
 imgObj.src = src;
 imgObj.onload=()=>{
   canvas.width=imgObj.naturalWidth;
   canvas.height=imgObj.naturalHeight;
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(imgObj,0,0);
   document.getElementById('msg').innerText = 'دوسي جوه الرسمة عشان تلوني بـ 100 لون!';
 };
 imgObj.onerror=()=>{ document.getElementById('msg').innerText = 'الصورة مش لاقياها، تأكدي ان اسمها '+src; };
}
function closeColor(){document.getElementById('colorPage').style.display='none';document.getElementById('homePage').style.display='block';}
function hexToRgba(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];}
function getPos(e){let r=canvas.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX),cy=(e.touches?e.touches[0].clientY:e.clientY);return{x:Math.floor((cx-r.left)*(canvas.width/r.width)),y:Math.floor((cy-r.top)*(canvas.height/r.height))};}
function floodFill(sx,sy,fill){let imgData=ctx.getImageData(0,0,canvas.width,canvas.height),data=imgData.data,stack=[[sx,sy]],sp=(sy*canvas.width+sx)*4,sr=data[sp],sg=data[sp+1],sb=data[sp+2],[fr,fg,fb]=fill;if(sr===fr&&sg===fg&&sb===fb)return;let vis=new Uint8Array(canvas.width*canvas.height);function match(p){let r=data[p],g=data[p+1],b=data[p+2];if(r<25&&g<25&&b<25)return false;return Math.abs(r-sr)<32&&Math.abs(g-sg)<32&&Math.abs(b-sb)<32;}while(stack.length){let [x,y]=stack.pop(),idx=y*canvas.width+x;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(vis[idx])continue;vis[idx]=1;let p=(y*canvas.width+x)*4;if(!match(p))continue;data[p]=fr;data[p+1]=fg;data[p+2]=fb;data[p+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(imgData,0,0);}
canvas.addEventListener('click',e=>{let p=getPos(e);floodFill(p.x,p.y,hexToRgba(current));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();let p=getPos(e);floodFill(p.x,p.y,hexToRgba(current));},{passive:false});
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgObj,0,0,canvas.width,canvas.height);}
function saveImage(){let a=document.createElement('a');a.download='mariam-art.png';a.href=canvas.toDataURL();a.click();}
</script>
</body>
 </html>
