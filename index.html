<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's little color world</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',sans-serif;background:#FFF7ED}
.hero{background:linear-gradient(135deg,#FF6B6B,#FFE66D,#4ECDC4);padding:22px 15px 50px;text-align:center}
.hero h1{font-size:28px;color:#fff;text-shadow:0 3px 0 #ff4d4d}
.hero p{background:#fff;color:#FF6F00;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:600}
.container{max-width:900px;margin:-28px auto 0;padding:0 12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 0 #FFE0B2;cursor:pointer;text-align:center}
.card img{width:100%;height:110px;object-fit:contain;background:#FFF8E1;border-radius:8px}
#colorPage{display:none;position:fixed;inset:0;background:#FFF7ED;z-index:9999;overflow:auto;padding:8px;text-align:center}
.topbar{max-width:480px;margin:0 auto;background:#fff;padding:8px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:420px;margin:10px auto;background:#fff;padding:8px;border-radius:12px}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #999;cursor:pointer}
.color.active{outline:2px solid #000;transform:scale(1.15)}
#mainCanvas{background:#fff;border-radius:12px;display:block;margin:10px auto;max-width:96vw;box-shadow:0 4px 10px rgba(0,0,0,.15);touch-action:none}
.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="homePage">
<div class="hero"><h1>🎨 Mariam's little color world 🌈</h1><p>دوسي على الرسمة عشان تلونيها</p></div>
<div class="container"><div class="card-grid" id="grid"></div></div>
</div>
<div id="colorPage">
<div class="topbar">
<button class="btn" style="background:#8D6E63;color:#fff" onclick="closeColor()">⬅ رجوع</button>
<b style="color:#FF6F00">100 لون</b>
<div><button class="btn" style="background:#8D6E63;color:#fff" onclick="clearCanvas()">مسح</button>
<button class="btn" style="background:#4ECDC4;color:#fff" onclick="saveImage()">حفظ 💾</button></div>
</div>
<div class="palette" id="pal"></div>
<canvas id="mainCanvas"></canvas>
</div>

<script>
// نجيب أسامي الصور من الصفحة نفسها

files.forEach(f=>{

 d.onclick=()=>openColor(f);
 grid.appendChild(d);
